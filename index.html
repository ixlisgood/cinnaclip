    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinnamoroll Screen Clipper</title>
    
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Cinnamoroll%20Clipper%22%2C%22short_name%22%3A%22CinaClipper%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%23ff91af%22%7D">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f3f7;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        h1 {
            color: #ff91af;
            margin-bottom: 5px;
        }
        p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }
        button {
            background-color: #ff91af;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            margin-top: 20px;
            width: 100%;
        }
        button:hover {
            background-color: #e07b96;
            transform: scale(1.02);
        }
        button:disabled {
            background-color: #cccccc;
            transform: none;
        }
        .status {
            margin-top: 25px;
            font-weight: bold;
            color: #555;
            padding: 10px;
            border-radius: 8px;
            background: #fafafa;
        }
        .pulse {
            animation: pulse-animation 2s infinite;
        }
        @keyframes pulse-animation {
            0% { background-color: #fafafa; }
            50% { background-color: #ffeef2; color: #ff91af; }
            100% { background-color: #fafafa; }
        }
        .log-box {
            margin-top: 20px;
            background: #222;
            color: #00ff00;
            font-family: monospace;
            font-size: 12px;
            padding: 15px;
            border-radius: 6px;
            text-align: left;
            height: 100px;
            overflow-y: auto;
        }
    </style>



<div class="container">
    <h1>Cinnamoroll Screen Clipper</h1>
    <p>Grant screen and mic permissions. Keep this app running in its window. Say <strong>"Cinnamoroll clip"</strong> to save the past 30 seconds.</p>
    
    <button id="startBtn">Start Screen Buffer</button>
    <div id="status" class="status">Status: Awaiting Activation</div>
    <div id="logBox" class="log-box">&gt; System ready. Press start...</div>
</div>

<script>
    let mainRecorder;
    let recordedChunks = [];
    let recognition;
    let isRunning = false;
    let stream;

    const startBtn = document.getElementById('startBtn');
    const statusDiv = document.getElementById('status');
    const logBox = document.getElementById('logBox');

    // Simple function to output terminal activity to the onscreen log-box
    function consoleLog(msg) {
        logBox.innerHTML += `<br>> ${msg}`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    startBtn.addEventListener('click', async () => {
        if (isRunning) return;

        try {
            consoleLog("Requesting screen capture...");
            stream = await navigator.mediaDevices.getDisplayMedia({
                video: { frameRate: 30 },
                audio: true 
            });

            consoleLog("Requesting mic context for voice command...");
            const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });

            startContinuousRecording(stream);
            initVoiceRecognition(micStream);

            isRunning = true;
            startBtn.disabled = true;
            startBtn.innerText = "Buffer Active";
            statusDiv.innerText = "Listening for voice command...";
            statusDiv.classList.add('pulse');
            consoleLog("Continuous capture timeline initialized.");

        } catch (err) {
            consoleLog("Error: " + err.message);
            alert("Could not start. Ensure screen and mic permissions are allowed.");
        }
    });

    function startContinuousRecording(screenStream) {
        recordedChunks = [];
        mainRecorder = new MediaRecorder(screenStream, { mimeType: 'video/webm; codecs=vp9' });

        mainRecorder.ondataavailable = (event) => {
            if (event.data && event.data.size > 0) {
                // Collect 100ms video segments continuously
                recordedChunks.push(event.data);
                
                // Safety limit: To prevent your Chromebook from running out of RAM memory 
                // during a long gaming/recording session, we drop chunks older than 45 seconds.
                if (recordedChunks.length > 450) {
                    recordedChunks.shift(); 
                }
            }
        };

        // Fire chunks into the array every 100 milliseconds
        mainRecorder.start(100); 

        screenStream.getVideoTracks()[0].onended = () => {
            stopEverything();
        };
    }

    function initVoiceRecognition(micStream) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            consoleLog("Speech recognition not supported.");
            return;
        }

        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        recognition.onresult = (event) => {
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    let transcript = event.results[i][0].transcript.toLowerCase().trim();
                    consoleLog(`Heard final: "${transcript}"`);

                    if (transcript.includes("cinnamoroll clip") || transcript.includes("cinnamon roll clip")) {
                        saveScreenClip();
                    }
                }
            }
        };

        recognition.onend = () => { if (isRunning) recognition.start(); };
        recognition.start();
    }

    function saveScreenClip() {
        if (recordedChunks.length === 0) return;
        consoleLog("🎬 Voice phrase matched! Extracting past 30 seconds...");
        
        // 100ms chunks * 10 = 1 second. 10 * 30 seconds = 300 chunks.
        // This isolates strictly the last 30 seconds out of the active buffer history.
        const lastThirtySecondsChunks = recordedChunks.slice(-300);
        
        // Compile only those extracted 30 seconds into the downloadable video file
        const compiledBlob = new Blob(lastThirtySecondsChunks, { type: 'video/webm' });
        
        const videoUrl = URL.createObjectURL(compiledBlob);
        const downloadLink = document.createElement('a');
        downloadLink.href = videoUrl;
        downloadLink.download = `Cinnamoroll_Clip_${Date.now()}.webm`;
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
        
        consoleLog("✅ 30-second video saved successfully!");
    }

    function stopEverything() {
        isRunning = false;
        if (mainRecorder && mainRecorder.state !== "inactive") mainRecorder.stop();
        if (recognition) recognition.stop();
        if (stream) stream.getTracks().forEach(track => track.stop());
        
        startBtn.disabled = false;
        startBtn.innerText = "Start Screen Buffer";
        statusDiv.innerText = "Status: Stopped";
        statusDiv.classList.remove('pulse');
        consoleLog("Session terminated.");
    }
</script>
