    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinnamoroll Screen Clipper</title>
    
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Cinnamoroll%20Clipper%22%2C%22short_name%22%3A%22CinaClipper%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%23ff91af%22%7D">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f3f7;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        h1 {
            color: #ff91af;
            margin-bottom: 5px;
        }
        p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }
        button {
            background-color: #ff91af;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            margin-top: 20px;
            width: 100%;
        }
        button:hover {
            background-color: #e07b96;
            transform: scale(1.02);
        }
        button:disabled {
            background-color: #cccccc;
            transform: none;
        }
        .status {
            margin-top: 25px;
            font-weight: bold;
            color: #555;
            padding: 10px;
            border-radius: 8px;
            background: #fafafa;
        }
        .pulse {
            animation: pulse-animation 2s infinite;
        }
        @keyframes pulse-animation {
            0% { background-color: #fafafa; }
            50% { background-color: #ffeef2; color: #ff91af; }
            100% { background-color: #fafafa; }
        }
        .log-box {
            margin-top: 20px;
            background: #222;
            color: #00ff00;
            font-family: monospace;
            font-size: 12px;
            padding: 15px;
            border-radius: 6px;
            text-align: left;
            height: 100px;
            overflow-y: auto;
        }
    </style>



<div class="container">
    <h1>Cinnamoroll Screen Clipper</h1>
    <p>Grant screen and mic permissions. Keep this app running in its window. Say <strong>"Cinnamoroll clip"</strong> to save the past 30 seconds.</p>
    
    <button id="startBtn">Start Screen Buffer</button>
    <div id="status" class="status">Status: Awaiting Activation</div>
    <div id="logBox" class="log-box">&gt; System ready. Press start...</div>
</div>

<script>
    let mainRecorder;
    let recordedChunks = [];
    let recognition;
    let isRunning = false;
    let mainStream;
    let loopInterval;

    const startBtn = document.getElementById('startBtn');
    const statusDiv = document.getElementById('status');
    const logBox = document.getElementById('logBox');

    function consoleLog(msg) {
        logBox.innerHTML += `<br>> ${msg}`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    startBtn.addEventListener('click', async () => {
        if (isRunning) return;

        try {
            consoleLog("Requesting screen capture...");
            mainStream = await navigator.mediaDevices.getDisplayMedia({
                video: { frameRate: 30 },
                audio: true 
            });

            consoleLog("Requesting mic context for voice commands...");
            const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });

            isRunning = true;
            startBtn.disabled = true;
            startBtn.innerText = "Buffer Active";
            statusDiv.innerText = "Listening for voice command...";
            statusDiv.classList.add('pulse');

            // Start the rolling memory loop
            startRollingRecorder();
            initVoiceRecognition(micStream);

        } catch (err) {
            consoleLog("Error: " + err.message);
            alert("Could not start. Ensure screen and mic permissions are allowed.");
        }
    });

    // Instead of cutting raw arrays up, we record real 30-second video segments.
    // Every 30 seconds, the previous segment is thrown away and a fresh clean one starts.
    // If you trigger a clip, it immediately downloads the active uncorrupted block.
    function startRollingRecorder() {
        recordedChunks = [];
        
        // Use standard containers supported natively by ChromeOS
        mainRecorder = new MediaRecorder(mainStream, { mimeType: 'video/webm; codecs=vp9' });

        mainRecorder.ondataavailable = (event) => {
            if (event.data && event.data.size > 0) {
                recordedChunks.push(event.data);
            }
        };

        mainRecorder.onstop = () => {
            // If the voice phrase triggers a save, the script will handle downloading.
            // Otherwise, if it naturally finishes its 30 seconds, clear memory and restart the loop cleanly.
            if (isRunning && mainStream.active) {
                if (statusDiv.innerText !== "Saving clip...") {
                    startRollingRecorder();
                }
            }
        };

        mainRecorder.start();
        consoleLog("🔄 New 30s recording buffer interval opened.");

        // Automatically close and recycle the file every 30 seconds to refresh the buffer window
        clearInterval(loopInterval);
        loopInterval = setInterval(() => {
            if (mainRecorder && mainRecorder.state === "recording") {
                mainRecorder.stop();
            }
        }, 30000); 
    }

    function initVoiceRecognition(micStream) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            consoleLog("Speech recognition not supported.");
            return;
        }

        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        recognition.onresult = (event) => {
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    let transcript = event.results[i][0].transcript.toLowerCase().trim();
                    consoleLog(`Heard final: "${transcript}"`);

                    if (transcript.includes("cinnamoroll clip") || transcript.includes("cinnamon roll clip")) {
                        saveScreenClip();
                    }
                }
            }
        };

        recognition.onend = () => { if (isRunning) recognition.start(); };
        recognition.start();
    }

    function saveScreenClip() {
        if (mainRecorder.state !== "recording") return;

        clearInterval(loopInterval); // Freeze the loop timer so it doesn't interrupt compilation
        statusDiv.innerText = "Saving clip...";
        consoleLog("🎬 Trigger matched! Finalizing video headers...");

        // Forcing a recorder stop compiles a clean video header structure with valid metadata timestamps
        mainRecorder.onstop = () => {
            const compiledBlob = new Blob(recordedChunks, { type: 'video/webm' });
            
            const videoUrl = URL.createObjectURL(compiledBlob);
            const downloadLink = document.createElement('a');
            downloadLink.href = videoUrl;
            downloadLink.download = `Cinnamoroll_Clip_${Date.now()}.webm`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            
            consoleLog("✅ Clean uncorrupted video saved successfully!");

            // Instantly resume the loop structure right after delivery
            statusDiv.innerText = "Listening for voice command...";
            startRollingRecorder();
        };

        mainRecorder.stop();
    }

    function stopEverything() {
        isRunning = false;
        clearInterval(loopInterval);
        if (mainRecorder && mainRecorder.state !== "inactive") mainRecorder.stop();
        if (recognition) recognition.stop();
        if (mainStream) mainStream.getTracks().forEach(track => track.stop());
        
        startBtn.disabled = false;
        startBtn.innerText = "Start Screen Buffer";
        statusDiv.innerText = "Status: Stopped";
        statusDiv.classList.remove('pulse');
        consoleLog("Session terminated.");
    }
</script>
